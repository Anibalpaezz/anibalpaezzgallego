<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151325"/>
      <stop offset="0.5" stop-color="#1B1833"/>
      <stop offset="1" stop-color="#201B40"/>
    </linearGradient>
    <linearGradient id="primaryG" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#5B3DF0"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF8A50"/>
      <stop offset="1" stop-color="#F0653D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#7C5CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="420" fill="url(#glow)"/>

  <!-- Monedas decorativas de fondo -->
  <g fill="#FF8A50" fill-opacity="0.20">
    <circle cx="230" cy="210" r="38"/>
    <circle cx="310" cy="720" r="52"/>
    <circle cx="1330" cy="240" r="42"/>
    <circle cx="1260" cy="660" r="34"/>
  </g>
  <g fill="#7C5CFF" fill-opacity="0.25">
    <circle cx="500" cy="160" r="26"/>
    <circle cx="1180" cy="120" r="30"/>
    <circle cx="180" cy="500" r="24"/>
    <circle cx="1450" cy="520" r="28"/>
  </g>

  <!-- Tarjeta central -->
  <rect x="470" y="225" width="660" height="450" rx="32" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>

  <!-- Pingüino tip: billete -->
  <g transform="translate(800 395)">
    <!-- Mano (pinza) -->
    <path d="M 60 -30 C 95 -40 115 -30 105 -15 C 98 -5 75 5 52 -5 Z" fill="url(#primaryG)"/>
    <!-- Billete -->
    <g transform="translate(6 -32) rotate(18)">
      <rect x="-70" y="-42" width="140" height="84" rx="12" fill="url(#accentG)"/>
      <rect x="-58" y="-30" width="116" height="60" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="0" cy="0" r="16" fill="#FFFFFF" fill-opacity="0.25"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">€</text>
    </g>
  </g>

  <g fill="#FFFFFF" font-family="'SF Mono', 'Cascadia Code', 'Consolas', monospace">
    <rect x="642" y="120" width="196" height="40" rx="20" fill="url(#accentG)"/>
    <text x="740" y="146" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">TIP</text>

    <rect x="596" y="560" width="288" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="740" y="581" text-anchor="middle" font-size="15" font-weight="600" fill="#E9E4FF">Turn · Amount · Weather</text>
  </g>

  <text x="800" y="640" text-anchor="middle" font-family="'Inter', sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">Tip Tracker</text>
</svg>