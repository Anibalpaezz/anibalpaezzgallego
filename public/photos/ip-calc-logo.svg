<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151325"/>
      <stop offset="0.5" stop-color="#1B1833"/>
      <stop offset="1" stop-color="#201B40"/>
    </linearGradient>
    <linearGradient id="primaryG" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#5B3DF0"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF8A50"/>
      <stop offset="1" stop-color="#F0653D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#7C5CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="420" fill="url(#glow)"/>

  <!-- Nodos de red (fondo) -->
  <g stroke="#FFFFFF" stroke-opacity="0.10">
    <line x1="140" y1="160" x2="420" y2="300"/>
    <line x1="420" y1="300" x2="340" y2="560"/>
    <line x1="340" y1="560" x2="160" y2="700"/>
    <line x1="1250" y1="180" x2="1040" y2="360"/>
    <line x1="1040" y1="360" x2="1180" y2="640"/>
    <line x1="1180" y1="640" x2="1420" y2="720"/>
  </g>
  <g fill="#7C5CFF" fill-opacity="0.25">
    <circle cx="140" cy="160" r="7"/>
    <circle cx="160" cy="700" r="7"/>
    <circle cx="1250" cy="180" r="7"/>
    <circle cx="1420" cy="720" r="7"/>
  </g>
  <g fill="#FF8A50" fill-opacity="0.22">
    <circle cx="420" cy="300" r="10"/>
    <circle cx="340" cy="560" r="10"/>
    <circle cx="1040" cy="360" r="10"/>
    <circle cx="1180" cy="640" r="10"/>
  </g>

  <!-- Octetos binarios (decoración) -->
  <g fill="#FFFFFF" fill-opacity="0.14" font-family="'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="20">
    <text x="180" y="520">11000000 . 10101000 . 00000001 . 01100100</text>
    <text x="830" y="820">2001 : 0db8 : 85a3 : : 8a2e : 0370 : 7334</text>
  </g>

  <!-- Tarjeta central -->
  <rect x="470" y="225" width="660" height="450" rx="32" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>

  <!-- Icono: red con nodos -->
  <g transform="translate(800 415)">
    <circle cx="0" cy="-95" r="30" fill="url(#accentG)"/>
    <circle cx="-85" cy="55" r="30" fill="url(#primaryG)"/>
    <circle cx="0" cy="-95" r="30" fill="url(#accentG)"/>
    <circle cx="85" cy="55" r="30" fill="url(#primaryG)"/>

    <g stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-95" x2="-30" y2="20"/>
      <line x1="0" y1="-95" x2="30" y2="20"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3">
      <line x1="-55" y1="15" x2="85" y2="-40"/>
      <line x1="55" y1="15" x2="-85" y2="-40"/>
    </g>
  </g>

  <!-- Etiquetas IP -->
  <g fill="#FFFFFF" font-family="'SF Mono', 'Cascadia Code', 'Consolas', monospace">
    <rect x="642" y="120" width="196" height="40" rx="20" fill="url(#primaryG)"/>
    <text x="740" y="146" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">IP</text>

    <rect x="596" y="210" width="288" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="740" y="231" text-anchor="middle" font-size="15" font-weight="600" fill="#E9E4FF">IPv4 / IPv6</text>
  </g>

  <text x="800" y="580" text-anchor="middle" font-family="'Inter', sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">IP Calculator</text>
  <text x="800" y="630" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="500" fill="#C9C2F0" fill-opacity="0.9">Subnet · Supernet · Binary octets</text>
</svg>